<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale Practice App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Scale Practice</h1>

        <!-- Display Area -->
        <div id="task">
            <h2>Generated Task</h2>
            <p id="scale-display">Scale: -</p>
            <p id="key-display">Key: -</p>
            <p id="position-display">Position: -</p>
            <p id="bpm-display">BPM: -</p>
            <button id="generate-task">Generate Task</button>
        </div>

        <!-- Settings Area -->
        <div id="settings">
            <h2>Settings</h2>

            <!-- Scales -->
            <h3>Scales</h3>
            <div class="three-column">
                <div class="column">
                    <h4>Non-Pent</h4>
                    <label><input type="checkbox" value="Major" checked> Major</label>
                    <label><input type="checkbox" value="Minor" checked> Minor</label>
                    <label><input type="checkbox" value="Lydian" checked> Lydian</label>
                </div>
                <div class="column">
                    <h4>Pent</h4>
                    <label><input type="checkbox" value="Maj. Pent." checked> Maj. Pent.</label>
                    <label><input type="checkbox" value="Min. Pent." checked> Min. Pent.</label>
                </div>
                <div class="column">
                    <h4>Other</h4>
                    <label><input type="checkbox" value="Dim." checked> Dim.</label>
                    <label><input type="checkbox" value="Condim." checked> Condim.</label>
                </div>
            </div>

            <!-- Keys -->
            <h3>Keys</h3>
            <div class="key-row">
                <label><input type="checkbox" value="C" checked> C</label>
                <label><input type="checkbox" value="D" checked> D</label>
                <label><input type="checkbox" value="E" checked> E</label>
            </div>

            <!-- BPM -->
            <h3>BPM</h3>
            <label>Min BPM: <input type="number" id="bpm-min" value="90"></label>
            <label>Max BPM: <input type="number" id="bpm-max" value="120"></label>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
